    :root {
      --navy: #092744;

      --white: #fffdf9;
      --ink: #172b40;

      font-family: Georgia, serif;
      font-style: italic;

      text-align: right;
    }

    .register-top {
      display: inline-flex;

      border: 1px solid var(--gold);

      font-family: Georgia, serif;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(6,29,51,.14);
      transition: .2s ease;
    }

    .register-top:hover {
      background: var(--gold);
      color: var(--navy-deep);
    }

      min-height: 50px;
      padding: 0 clamp(18px, 5vw, 76px);
      background: var(--navy);
      color: var(--ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vw, 58px);
      position: relative;
      z-index: 5;
