<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agent Access | Royal Bridges</title>

<style>

body{margin:0;background:#f8f3e9;color:#172b40;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}

.card{max-width:560px;width:100%;padding:38px 28px;background:#fffdf9;border:1px solid #dfc99f;text-align:center;box-shadow:0 12px 32px rgba(6,29,51,.12)}

img{width:190px;height:80px;object-fit:contain}

h1{font:normal 34px Georgia,serif;color:#092744}

p{color:#687582;line-height:1.7}

.status{margin:22px 0;padding:13px;background:#f1e8d9;border-left:3px solid #c99b4b;color:#092744}

a{display:inline-block;margin:8px;padding:11px 18px;background:#092744;color:#e5c27e;text-decoration:none;font-size:13px}

</style>

</head>

<body>

<div class="card">

<img src="./logo.png" alt="Royal Bridges Real Estate">

<h1 id="heading">Agent Access</h1>

<p id="description">Welcome to the Royal Bridges agent access area.</p>

<div class="status">The secure agent portal and restricted CRM access are being prepared.</div>

<p>Please contact the administration team if you require access assistance.</p>

<a href="mailto:info@royalbridges.ae?subject=Royal%20Bridges%20Agent%20Access">CONTACT ADMINISTRATION</a>

<a href="index.html">RETURN TO WEBSITE</a>

</div>

<script>

var role=new URLSearchParams(window.location.search).get("role");

if(role==="internal"){

 document.getElementById("heading").textContent="Internal Agent Access";

 document.getElementById("description").textContent="Welcome to the Royal Bridges internal agent area.";

}else if(role==="external"){

 document.getElementById("heading").textContent="External Agent Access";

 document.getElementById("description").textContent="Welcome to the Royal Bridges external agent area.";

}

</script>

</body>

</html>
